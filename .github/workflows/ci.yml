name: Store Rating CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Test, Lint & Build Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Execute Backend Automated Test Suites (52 tests)
        run: npm --prefix backend test
        env:
          NODE_ENV: test
          PORT: 5000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: store_rating_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          JWT_SECRET: super_secure_ci_test_secret_key_1234567890
          JWT_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:5173

      - name: Build Frontend Production Assets
        run: npm --prefix frontend run build
